<title>棋盘之下四稿</title>
<meta name="robots" content="noindex">
<style>
  /* PROTOTYPE — throwaway. Palette lifted verbatim from ios/App/Chessfen/Palette.swift so the
     four drafts are judged in the app's own colours and not in a browser's. */
  :root {
    --parchment: #F7EDE1;
    --raised: #FFF7EE;
    --ink: #241A12;
    --inkSoft: #7A6350;
    --walnut: #6B4522;
    --analysis: #2E7D6E;
    --alarm: #B3402A;
    --mine: #6C4AB6;
    --boardLight: #FFCE9E;
    --boardDark: #D18B47;
    --hairline: rgba(107, 69, 34, 0.18);
    --chipRest: rgba(107, 69, 34, 0.10);
    --barBlack: #241A12;
    --barWhite: #FFFCF7;
    --lab: #EAE0D2;
    --labInk: #241A12;
    --labSoft: #7A6350;
    --labPanel: #FBF5EC;
    --pieceW: #FFFCF7;
    --pieceWEdge: rgba(40, 28, 18, 0.85);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --parchment: #17110C;
      --raised: #241A12;
      --ink: #F2E4D5;
      --inkSoft: #B09880;
      --analysis: #4FB8A4;
      --alarm: #E87A62;
      --mine: #A78BFA;
      --hairline: rgba(255, 255, 255, 0.16);
      --chipRest: rgba(255, 255, 255, 0.10);
      --barBlack: #4A3A2C;
      --barWhite: #F2E4D5;
      --lab: #100B07;
      --labInk: #F2E4D5;
      --labSoft: #B09880;
      --labPanel: #1C1510;
    }
  }
  :root[data-theme="dark"] {
    --parchment: #17110C;
    --raised: #241A12;
    --ink: #F2E4D5;
    --inkSoft: #B09880;
    --analysis: #4FB8A4;
    --alarm: #E87A62;
    --mine: #A78BFA;
    --hairline: rgba(255, 255, 255, 0.16);
    --chipRest: rgba(255, 255, 255, 0.10);
    --barBlack: #4A3A2C;
    --barWhite: #F2E4D5;
    --lab: #100B07;
    --labInk: #F2E4D5;
    --labSoft: #B09880;
    --labPanel: #1C1510;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--lab);
    color: var(--labInk);
    font: 14px/1.55 -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    padding: 22px 18px 116px;
  }
  header { max-width: 1040px; margin: 0 auto 20px; }
  h1 {
    font: 600 21px/1.3 -apple-system, "PingFang SC", system-ui, sans-serif;
    letter-spacing: 0.02em;
    margin: 0 0 6px;
  }
  .lede { color: var(--labSoft); font-size: 13px; max-width: 62ch; margin: 0; }
  .lede code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }

  .stage {
    max-width: 1040px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 402px minmax(0, 1fr);
    gap: 26px;
    align-items: start;
  }
  @media (max-width: 820px) { .stage { grid-template-columns: minmax(0, 1fr); } }

  /* ------------------------------------------------------------------ phone */
  .phone {
    width: 402px;
    max-width: 100%;
    height: 874px;
    background: var(--parchment);
    color: var(--ink);
    border-radius: 34px;
    border: 1px solid var(--hairline);
    box-shadow: 0 18px 40px -18px rgba(20, 12, 6, 0.45);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .navbar {
    height: 38px;
    flex: 0 0 auto;
    border-bottom: 0.5px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 14px;
    color: var(--inkSoft);
    font-size: 12px;
    gap: 10px;
  }

  /* player bars */
  .side {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 8px 7px 13px;
    border-top: 0.5px solid var(--hairline);
    font-size: 12px;
    color: var(--inkSoft);
    min-height: 44px;
  }
  .side.live { background: var(--raised); box-shadow: inset 3px 0 0 var(--analysis); }
  .side .who { color: var(--ink); font-weight: 600; font-size: 13px; }
  .swatch { width: 13px; height: 13px; border-radius: 50%; border: 1px solid var(--walnut); }
  .swatch.w { background: var(--barWhite); }
  .swatch.b { background: var(--barBlack); }
  .turn { color: var(--analysis); font-weight: 600; }
  .grow { flex: 1 1 auto; min-width: 0; }
  .btn-hold {
    border: 0;
    background: var(--analysis);
    color: var(--parchment);
    font: 600 12px/1 inherit;
    padding: 8px 11px;
    border-radius: 999px;
  }

  /* the standing strip */
  .standing {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 30px;
    padding: 0 12px;
    margin: 6px 0;
  }
  .evalbar {
    flex: 1 1 auto;
    height: 6px;
    border-radius: 999px;
    background: var(--barBlack);
    border: 0.5px solid rgba(107, 69, 34, 0.35);
    overflow: hidden;
    position: relative;
  }
  .evalbar i { display: block; height: 100%; background: var(--barWhite); }
  .evalbar::after {
    content: "";
    position: absolute;
    inset: 0 auto 0 50%;
    width: 1px;
    background: var(--analysis);
  }
  .score {
    font: 600 20px/1 ui-rounded, -apple-system, system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    color: var(--analysis);
  }
  .score.mate { color: var(--alarm); }

  /* board */
  .boardwrap { position: relative; width: 402px; max-width: 100%; aspect-ratio: 1; flex: 0 0 auto; }
  .squares { display: grid; grid-template-columns: repeat(8, 1fr); width: 100%; height: 100%; }
  .sq { position: relative; display: grid; place-items: center; }
  .sq.l { background: var(--boardLight); }
  .sq.d { background: var(--boardDark); }
  .sq.last::after {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--analysis);
    opacity: 0.28;
  }
  .glyph {
    font-size: 40px;
    line-height: 1;
    position: relative;
    z-index: 2;
    user-select: none;
  }
  .glyph.w { color: var(--pieceW); text-shadow: 0 0 1px var(--pieceWEdge), 0 0 2px var(--pieceWEdge), 1px 1px 0 var(--pieceWEdge), -1px 1px 0 var(--pieceWEdge); }
  .glyph.b { color: #1B120A; text-shadow: 0 0 1px rgba(255, 250, 240, 0.5); }
  .coord {
    position: absolute;
    bottom: 1px;
    right: 3px;
    font-size: 8px;
    color: rgba(60, 40, 22, 0.5);
    z-index: 1;
  }
  .arrows { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .arrows text {
    font: 700 0.28px/1 ui-rounded, -apple-system, system-ui, sans-serif;
    fill: #fff;
    text-anchor: middle;
    dominant-baseline: central;
  }
  .boardnote {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 10px;
    z-index: 4;
    background: rgba(23, 17, 12, 0.86);
    color: #F7EDE1;
    padding: 8px 11px;
    border-radius: 12px;
    font-size: 12px;
    line-height: 1.5;
  }
  .boardnote b { color: #FFCE9E; font-weight: 600; }

  /* record */
  .record {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    height: 46px;
    flex: 0 0 auto;
  }
  .stepper {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: var(--chipRest);
    display: grid;
    place-items: center;
    color: var(--inkSoft);
    font-size: 12px;
  }
  .cards { display: flex; gap: 6px; overflow: hidden; flex: 1 1 auto; }
  .movecard {
    background: var(--chipRest);
    border-radius: 9px;
    padding: 5px 8px;
    font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--ink);
    white-space: nowrap;
  }
  .movecard.now { background: var(--analysis); color: var(--parchment); }

  /* the area under the record — what the four drafts are about */
  .under {
    flex: 1 1 auto;
    min-height: 0;
    border-top: 0.5px solid var(--hairline);
    overflow: auto;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .pad { padding: 10px 16px; }
  .cap { font-size: 12px; color: var(--inkSoft); }
  .cap2 { font-size: 11px; color: var(--inkSoft); }
  .body { font-size: 13px; color: var(--ink); }
  .mono { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--chipRest);
    color: var(--inkSoft);
    border: 0;
    border-radius: 999px;
    padding: 7px 12px;
    font: 13px/1 inherit;
    cursor: pointer;
  }
  .chip.on { color: var(--mine); }
  .chip.teal.on { color: var(--analysis); }
  .chiprow { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 6px; }
  .sectiontitle { font-size: 12px; color: var(--inkSoft); letter-spacing: 0.08em; }
  .ghost {
    border: 0;
    background: transparent;
    color: var(--analysis);
    font: 600 12px/1 inherit;
    padding: 6px 0;
    cursor: pointer;
  }
  .rule { height: 0.5px; background: var(--hairline); }

  /* the news bar — the one new thing all four drafts have to place */
  .news {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    border: 0;
    cursor: pointer;
    font: inherit;
    padding: 10px 14px;
    background: color-mix(in srgb, var(--alarm) 14%, var(--parchment));
    box-shadow: inset 3px 0 0 var(--alarm);
    color: var(--ink);
  }
  .news.ours {
    background: color-mix(in srgb, var(--mine) 14%, var(--parchment));
    box-shadow: inset 3px 0 0 var(--mine);
  }
  .news .n {
    font: 700 15px/1 ui-rounded, -apple-system, system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    color: var(--alarm);
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: color-mix(in srgb, var(--alarm) 22%, transparent);
  }
  .news.ours .n { color: var(--mine); background: color-mix(in srgb, var(--mine) 22%, transparent); }
  .news .t { flex: 1 1 auto; font-size: 13px; line-height: 1.45; }
  .news .t em { font-style: normal; color: var(--inkSoft); font-size: 11px; display: block; }
  .news .go { color: var(--inkSoft); font-size: 12px; flex: 0 0 auto; }
  .linechips { display: flex; gap: 6px; flex-wrap: wrap; }
  .linechip {
    font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 4px 7px;
    border-radius: 7px;
    background: var(--chipRest);
    color: var(--ink);
    display: inline-flex;
    gap: 5px;
    align-items: center;
  }
  .linechip b {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font: 700 9px/1 ui-rounded, system-ui, sans-serif;
    color: #fff;
  }

  /* B: drawers */
  .segbar {
    display: flex;
    gap: 4px;
    padding: 8px 16px 0;
    flex: 0 0 auto;
  }
  .seg {
    flex: 1 1 0;
    border: 0;
    background: var(--chipRest);
    color: var(--inkSoft);
    font: 13px/1 inherit;
    padding: 9px 0;
    border-radius: 10px;
    cursor: pointer;
  }
  .seg.on { background: var(--analysis); color: var(--parchment); font-weight: 600; }
  .drawer { overflow: auto; flex: 1 1 auto; }

  /* C: the floating answer */
  .float {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 12px;
    z-index: 6;
    background: var(--raised);
    border: 0.5px solid var(--hairline);
    border-radius: 16px;
    box-shadow: 0 12px 28px -14px rgba(20, 12, 6, 0.6);
    padding: 12px 14px;
  }
  .gesture {
    display: flex;
    gap: 8px;
    align-items: baseline;
    font-size: 11px;
    color: var(--inkSoft);
    padding: 8px 16px;
  }

  /* D: the deck */
  .deck { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  .card {
    flex: 1 1 auto;
    margin: 10px 14px 6px;
    background: var(--raised);
    border: 0.5px solid var(--hairline);
    border-radius: 16px;
    padding: 12px 14px;
    overflow: auto;
  }
  .card.newscard { border-color: color-mix(in srgb, var(--alarm) 55%, var(--hairline)); }
  .dots { display: flex; gap: 6px; justify-content: center; padding: 4px 0 10px; align-items: center; }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--chipRest);
    border: 0;
    padding: 0;
    cursor: pointer;
  }
  .dot.on { background: var(--inkSoft); }
  .dot.hot { background: var(--alarm); box-shadow: 0 0 0 3px color-mix(in srgb, var(--alarm) 22%, transparent); }
  .swipe { display: flex; justify-content: space-between; padding: 0 14px 6px; }

  /* A: the sheet */
  .sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 7;
    background: var(--raised);
    border-top: 0.5px solid var(--hairline);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -14px 30px -18px rgba(20, 12, 6, 0.5);
    padding: 12px 16px 18px;
  }
  .sheetrow {
    display: flex;
    align-items: baseline;
    gap: 10px;
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    font: inherit;
    color: var(--ink);
    padding: 10px 0;
    border-bottom: 0.5px solid var(--hairline);
    cursor: pointer;
  }
  .sheetrow:last-of-type { border-bottom: 0; }
  .sheetrow small { color: var(--inkSoft); font-size: 11px; }
  .sheetrow[disabled] { opacity: 0.38; cursor: default; }

  /* ------------------------------------------------------- the argument panel */
  aside { position: sticky; top: 22px; display: flex; flex-direction: column; gap: 14px; }
  .arg {
    background: var(--labPanel);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    padding: 16px 18px;
  }
  .arg h2 {
    margin: 0 0 2px;
    font: 600 17px/1.3 -apple-system, "PingFang SC", system-ui, sans-serif;
  }
  .arg .kicker {
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--labSoft);
    text-transform: uppercase;
    margin: 0 0 10px;
  }
  dl { margin: 0; display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px 12px; }
  dt { font-size: 12px; color: var(--labSoft); }
  dd { margin: 0; font-size: 13px; line-height: 1.6; }
  dd .mono { font-size: 12px; }
  .cost { color: var(--alarm); }
  .shared { font-size: 12px; color: var(--labSoft); line-height: 1.65; }
  .shared b { color: var(--labInk); font-weight: 600; }

  /* ------------------------------------------------------------- switchers */
  .switcher {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 40;
    background: color-mix(in srgb, var(--labPanel) 92%, transparent);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--hairline);
    padding: 10px 16px;
    display: flex;
    gap: 18px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }
  .group { display: flex; gap: 6px; align-items: center; }
  .group > span {
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--labSoft);
    margin-right: 2px;
  }
  .tab {
    border: 1px solid var(--hairline);
    background: transparent;
    color: var(--labInk);
    font: 13px/1 inherit;
    padding: 8px 12px;
    border-radius: 9px;
    cursor: pointer;
  }
  .tab.on { background: var(--labInk); color: var(--labPanel); border-color: var(--labInk); }
  .tab kbd {
    font: 10px ui-monospace, Menlo, monospace;
    opacity: 0.55;
    margin-left: 5px;
  }
  button:focus-visible, .dot:focus-visible { outline: 2px solid var(--analysis); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) {
    .news, .card, .float { transition: background 0.18s ease; }
  }
</style>

<header>
  <h1>棋盘之下四稿</h1>
  <p class="lede">
    一次性原型，不进 <code>main</code>。棋盘下面现在是六个开关（练习 · 问一格 · 战术 · 这步的要害 ·
    走马灯 · 五步计划）加十段说明，按写代码的顺序竖着摞着。四稿各自回答同一个问题：
    <b>这一摞怎么收</b>，以及新来的「N 步杀」——它不是开关，是<b>消息</b>——摆在哪里。
    局面是真的：Opera Game 第 16 手（<span class="mono">Qb8+ Nxb8 Rd8#</span>，2 步杀）和意大利开局第 8 手。
    点消息条就画箭头。
  </p>
</header>

<div class="stage">
  <div class="phone" id="phone"></div>
  <aside id="argument"></aside>
</div>

<nav class="switcher" aria-label="原型开关">
  <div class="group" id="variants"><span>稿</span></div>
  <div class="group" id="scenarios"><span>局面</span></div>
  <div class="group" id="modes"><span>引擎</span></div>
</nav>

<script>
  // ---------------------------------------------------------------- positions
  const FEN = {
    // Opera Game, Morphy–Duke of Brunswick & Count Isouard, Paris 1858, before 16.Qb8+.
    // 16.Qb8+ Nxb8 17.Rd8# — a mate in two anybody can check.
    opera: "4kb1r/p2n1ppp/4q3/4p1B1/4P3/1Q6/PPP2PPP/2KR4",
    // The same game five plies earlier, White to move: 13.Rxd7! is the shot.
    shot: "3rkb1r/p2nqppp/5n2/1B2p1B1/4P3/1Q6/PPP2PPP/2KR3R",
    // The Italian eight plies in — the repo's own screenshot fixture.
    italian: "r1bqk2r/pppp1ppp/2n2n2/2b1p3/2B1P3/2P2N2/PP1P1PPP/R1BQK2R",
    // The same Opera Game right after 13.Rxd7 — a past Ply, which is the only place
    // 要害 / 走马灯 / 五步计划 / 考一遍 exist at all.
    afterShot: "3rkb1r/p2Rqppp/5n2/1B2p1B1/4P3/1Q6/PPP2PPP/2K4R",
  };

  const GLYPH = { p: "♟", n: "♞", b: "♝", r: "♜", q: "♛", k: "♚" };

  const SCENARIOS = {
    mine: {
      label: "你有 2 步杀",
      fen: FEN.opera,
      youAre: "w",
      toMove: "w",
      flipped: false,
      last: ["d7", "f6"],
      moves: ["…", "13.Rxd7", "Rxd7", "14.Rd1", "Qe6", "15.Bxd7+", "Nxd7"],
      eval: 1,
      score: "#2",
      mate: {
        n: 2,
        whose: "ours",
        head: "你有 2 步杀",
        sentence: "Qb8+ 送后，马只能吃；Rd8 将死，d8 有 g5 的象守着。",
        line: [
          { san: "Qb8+", from: "b3", to: "b8", mine: true },
          { san: "Nxb8", from: "d7", to: "b8", mine: false },
          { san: "Rd8#", from: "d1", to: "d8", mine: true },
        ],
      },
    },
    theirs: {
      label: "对方 2 步杀你",
      fen: FEN.opera,
      youAre: "b",
      toMove: "w",
      flipped: true,
      last: ["d7", "f6"],
      moves: ["…", "13.Rxd7", "Rxd7", "14.Rd1", "Qe6", "15.Bxd7+", "Nxd7"],
      eval: 0,
      score: "#-2",
      mate: {
        n: 2,
        whose: "theirs",
        head: "对方 2 步杀",
        sentence: "白 Qb8+ 之后你只能 Nxb8，Rd8 将死 —— d8 有 g5 的象守着，吃不掉。",
        line: [
          { san: "Qb8+", from: "b3", to: "b8", mine: false },
          { san: "Nxb8", from: "d7", to: "b8", mine: true },
          { san: "Rd8#", from: "d1", to: "d8", mine: false },
        ],
      },
    },
    tactic: {
      label: "有战术，没有杀",
      fen: FEN.shot,
      youAre: "w",
      toMove: "w",
      flipped: false,
      last: ["a8", "d8"],
      moves: ["…", "11.Bxb5+", "Nbd7", "12.O-O-O", "Rd8"],
      eval: 0.78,
      score: "+3.4",
      tactic: {
        san: "Rxd7",
        from: "d1",
        to: "d7",
        sentence: "Rxd7 吃 d7 的马，这笔赚",
        line: [
          { san: "Rxd7", from: "d1", to: "d7", mine: true },
          { san: "Rxd7", from: "d8", to: "d7", mine: false },
          { san: "Rd1", from: "h1", to: "d1", mine: true },
          { san: "Qe6", from: "e7", to: "e6", mine: false },
          { san: "Bxd7+", from: "b5", to: "d7", mine: true },
        ],
      },
    },
    past: {
      label: "在回看第 13 步",
      fen: FEN.afterShot,
      youAre: "w",
      toMove: "b",
      flipped: false,
      atPast: true,

  // ------------------------------------------------------------------- board
  function squares(fen) {
    const rows = fen.split(" ")[0].split("/");
    const out = {};
    rows.forEach((row, r) => {
      let file = 0;
      for (const ch of row) {
        if (/\d/.test(ch)) {
          file += Number(ch);
          continue;
        }
        const name = "abcdefgh"[file] + (8 - r);
        out[name] = { kind: ch.toLowerCase(), colour: ch === ch.toUpperCase() ? "w" : "b" };
        file += 1;
      }
    });
    return out;
  }

  function place(name, flipped) {
    const file = "abcdefgh".indexOf(name[0]);
    const rank = Number(name[1]) - 1;
    return flipped
      ? { col: 7 - file, row: rank }
      : { col: file, row: 7 - rank };
  }

  function centre(name, flipped) {
    const p = place(name, flipped);
    return { x: p.col + 0.5, y: p.row + 0.5 };
  }

  function board(scene, arrows) {
    const pieces = squares(scene.fen);
    let cells = "";
    for (let row = 0; row < 8; row++) {
      for (let col = 0; col < 8; col++) {
        const file = scene.flipped ? 7 - col : col;
        const rank = scene.flipped ? row : 7 - row;
        const name = "abcdefgh"[file] + (rank + 1);
        const light = (file + rank) % 2 === 1;
        const piece = pieces[name];
        const last = scene.last && scene.last.includes(name) ? " last" : "";
        cells +=
          `<div class="sq ${light ? "l" : "d"}${last}">` +
          (piece ? `<span class="glyph ${piece.colour}">${GLYPH[piece.kind]}</span>` : "") +
          (col === 0 || row === 7 ? `<span class="coord">${name}</span>` : "") +
          `</div>`;
      }
    }
    return `<div class="boardwrap">
      <div class="squares">${cells}</div>
      ${arrowLayer(scene, arrows)}
    </div>`;
  }

  // The one mechanic that does not vary between the drafts: numbered arrows, the mover's
  // violet and the answers' red — exactly BoardView.drawPlanArrow.
  function arrowLayer(scene, arrows) {
    if (!arrows || !arrows.length) return "";
    const parts = arrows.map((step, index) => {
      const a = centre(step.from, scene.flipped);
      const b = centre(step.to, scene.flipped);
      const angle = Math.atan2(b.y - a.y, b.x - a.x);
      const head = 0.3;
      const tipX = b.x - Math.cos(angle) * 0.06;
      const tipY = b.y - Math.sin(angle) * 0.06;
      const baseX = tipX - Math.cos(angle) * head;
      const baseY = tipY - Math.sin(angle) * head;
      const wing = 0.17;
      const colour = step.mine ? "var(--mine)" : "var(--alarm)";
      const dim = step.dim ? 0.34 : 0.85;
      const label = {
        x: a.x + (b.x - a.x) / 3,
        y: a.y + (b.y - a.y) / 3,
      };
      return `<g opacity="${dim}">
        <line x1="${a.x}" y1="${a.y}" x2="${baseX}" y2="${baseY}"
              stroke="${colour}" stroke-width="0.1" stroke-linecap="round"></line>
        <polygon points="${tipX},${tipY}
                         ${baseX - Math.sin(angle) * -wing},${baseY + Math.cos(angle) * -wing}
                         ${baseX + Math.sin(angle) * -wing},${baseY - Math.cos(angle) * -wing}"
                 fill="${colour}"></polygon>
        <circle cx="${label.x}" cy="${label.y}" r="0.19" fill="${colour}"></circle>
        <text x="${label.x}" y="${label.y}">${index + 1}</text>
      </g>`;
    });
    return `<svg class="arrows" viewBox="0 0 8 8" aria-hidden="true">${parts.join("")}</svg>`;
  }

  function lineChips(line) {
    return `<div class="linechips">${line

  }

        title: "走马灯",
        sub: "引擎说的后面五步，在盘上走一遍给我看",
        body: `<div class="cap" style="margin:4px 0 8px">${lineChips(scene.walk.line)}</div>
          <div class="body" style="font-size:12px">${scene.walk.outcome}</div>
          <button class="ghost" onclick="tap('arrows')">${
            state.arrows ? "把箭头收起" : "画在棋盘上（5 个箭头）"
          }</button>
          <div class="cap2">走完退出，局面原样回来，棋谱里什么都不留。</div>`,
      });
    }
    if (scene.atPast) {
      cards.push({
        title: "五步计划",
        sub: "我自己走五步，说一个理由，让它判我对不对",
        body: `<div class="cap" style="margin:4px 0 8px">在棋盘上随便走。走一步，就重算一次后面五步 —— 紫色是你的，红色是对方最好的应手。</div>
          <div class="cap2">最多五步：再长对方回得太多，对错就没法判了。走完说一个理由，交卷。</div>`,
      });
      cards.push({
        title: "复盘",
        sub: "用同一个深度把整局重算，让每步的分能互相比",
        body: `<div class="cap" style="margin:4px 0 8px">重算过 21 步。这局得失最大的三步，按大小排 —— 局内排名，不跟阈值比。点一个，棋盘跳过去、引擎闭嘴，就是一次「考一遍」。</div>
          <div class="linechips">${(scene.worst || [])
            .map(
              (w) =>
                `<span class="linechip"><b style="background:var(--alarm)">${w.rank}</b>${w.san} <span style="color:var(--inkSoft)">−${w.lost}</span></span>`
            )
            .join("")}</div>
          <div class="cap2" style="margin-top:6px">「最贵三步」不是另一张卡：它就是这一遍重算的产物，没重算过它不存在。</div>`,
      });
    }
    cards.push({
      title: "变着",
      sub: "走过又退回去的那些线，还留着",
      body: `<div class="cap">2 条。悔棋不丢东西 —— 退回去的那条挂在那一步下面，PGN 的括号本来就是干这个的。</div>`,
    });
    // What this position cannot answer, and what would buy it.
    const missing = [];
    if (!scene.atPast) {
      missing.push(["这步的要害 · 走马灯 · 五步计划 · 考一遍", "要先用记录条退到过去某一步 —— 最新局面上没有「刚走的这步」可说"]);
      missing.push(["复盘 · 最贵三步", "要先打开引擎意见，让它按统一深度把整局重算一遍"]);
    } else {
      missing.push(["杀 · 战术 · 问一格", "回看过去某一步时它们不开口 —— 那是一次考一遍，答案得你先给"]);
    }
    cards.push({
      quiet: true,
      title: "这儿还问不了的",
      sub: "缺什么，以及怎么补",
      body: missing
        .map(
          ([what, why]) =>
            `<div style="margin-bottom:8px"><div class="body" style="font-size:12px">${what}</div><div class="cap2">${why}</div></div>`
        )
        .join(""),
    });
    return cards;
  }

  function draftD(scene) {
    const cards = deckFor(scene);
    const index = Math.min(state.card, cards.length - 1);
    const card = cards[index];
    return `<div class="deck">
      <div class="card ${card.hot ? "newscard" : ""}" style="${
        card.quiet ? "background:transparent;border-style:dashed" : ""
      }">
        <div style="display:flex;align-items:baseline;gap:8px">
          <b style="font-size:15px;color:${card.hot ? "var(--alarm)" : "var(--ink)"}">${card.title}</b>
          <span class="grow"></span>
          <span class="cap2">${index + 1} / ${cards.length}</span>
        </div>
        <div class="cap2" style="margin:1px 0 7px">${card.sub}</div>
        ${card.body}
      </div>
      <div class="swipe">
        <button class="ghost" onclick="tap('card',${index - 1})">‹ 前一张</button>
        <button class="ghost" onclick="tap('card',${index + 1})">后一张 ›</button>
      </div>
      <div class="dots">
        ${cards
          .map(
            (c, i) =>
              `<button class="dot ${i === index ? "on" : ""} ${c.hot && i !== index ? "hot" : ""}"
                 onclick="tap('card',${i})" aria-label="第 ${i + 1} 张：${c.title}"></button>`
          )
          .join("")}
      </div>
    </div>`;
  }

  // ------------------------------------------------------------------ render
  function visibleArrows(scene) {
    if (state.variant === "C" && scene.mate) {
      // Draft C draws them at rest, dimmed and wordless; a tap only lights them and
      // brings the sentence.
      return scene.mate.line.map((step) => ({ ...step, dim: !state.arrows }));
    }
    if (!state.arrows) {
      if (scene.tactic && !scene.atPast && !state.practice && state.variant !== "D") {
        return [{ ...scene.tactic, mine: true }];
      }
      return [];
    }
    const source = scene.mate || scene.tactic || scene.walk;
    return source ? source.line : [];
  }

  function remember() {
    const next = new URLSearchParams({
      v: state.variant,
      s: state.scenario,
      arrows: state.arrows ? "1" : "0",
      practice: state.practice ? "1" : "0",
    });
    try {
      history.replaceState(null, "", "?" + next.toString());
    } catch (error) { /* sandboxed */ }
  }

  function render() {
    remember();
    const scene = SCENARIOS[state.scenario];
    const under = { A: draftA, B: draftB, C: draftC, D: draftD }[state.variant](scene);
    const top = scene.flipped ? "w" : "b";
    const bottom = scene.flipped ? "b" : "w";
    document.getElementById("phone").innerHTML = `
      <div class="navbar"><span>⇅ 翻转</span><span>⋯</span></div>
      ${playerBar(top, scene)}
      ${board(scene, visibleArrows(scene))}
      ${standing(scene)}
      ${playerBar(bottom, scene)}
      ${record(scene)}
      <div class="under">${under}</div>
      ${state.variant === "C" ? floatCard(scene) : ""}
    `;

    const v = VARIANTS[state.variant];
    document.getElementById("argument").innerHTML = `
      <div class="arg">
        <p class="kicker">${v.kicker}</p>
        <h2>${state.variant} · ${v.name}</h2>
        <dl>
          <dt>主张</dt><dd>${v.claim}</dd>
          <dt>杀怎么说</dt><dd>${v.news}</dd>
          <dt>练习怎么办</dt><dd>${v.practice}</dd>
          <dt>代价</dt><dd class="cost">${v.cost}</dd>
          <dt>要动的码</dt><dd>${v.code}</dd>
        </dl>
      </div>
      <div class="arg shared">
        <b>四稿共用的那一件事</b><br>
        「点一下 → 多个箭头」在四稿里一模一样，因为那是要加的功能本身，不是四稿的分歧：编号箭头，
        紫色＝走这步的是你，红色＝对方，号码在箭杆三分之一处 —— 就是今天 五步计划 已经在画的
        <span class="mono">PlanArrow</span>。杀的线走 <span class="mono">startWalk(line:)</span> 已有的路，
        <span class="mono">Analysis.best.score</span> 是 <span class="mono">.mate(±n)</span> 时就有消息。
        <br><br>
        <b>分歧只有两处</b>：一，这一摞开关收成什么形状；二，杀这条消息<b>能不能盖过练习</b>——
        A 盖，B 只报数不报招，C 只画不说话，D 等你划过去。
        <br><br>
        <b>±n 一个口就够</b>：引擎的分数永远是走棋一方的视角，<span class="mono">.mate(+2)</span> 是该走的一方
        两步杀，<span class="mono">.mate(-2)</span> 是该走的一方两步被杀。「我方的还是对方的」不是两套逻辑，
        是同一个数配上 <span class="mono">youAre</span> 换一句话、换一个颜色。
      </div>
    `;

    const tabs = [
      ["variants", Object.keys(VARIANTS).map((k) => [k, `${k} · ${VARIANTS[k].name}`]), "variant"],
      ["scenarios", Object.keys(SCENARIOS).map((k) => [k, SCENARIOS[k].label]), "scenario"],
    ];
    for (const [id, entries, key] of tabs) {
      const host = document.getElementById(id);
      host.querySelectorAll(".tab").forEach((el) => el.remove());
      for (const [value, label] of entries) {
        const button = document.createElement("button");
        button.className = "tab" + (state[key] === value ? " on" : "");
        button.textContent = label;
        button.onclick = () => {
          state[key] = value;
          state.arrows = false;
          state.sheet = false;
          state.card = 0;
          render();
        };
        host.append(button);
      }
    }
    const modes = document.getElementById("modes");
    modes.querySelectorAll(".tab").forEach((el) => el.remove());
    for (const [value, label] of [[false, "开口"], [true, "练习（闭嘴）"]]) {
      const button = document.createElement("button");
      button.className = "tab" + (state.practice === value ? " on" : "");
      button.textContent = label;
      button.onclick = () => {
        state.practice = value;
        state.arrows = false;
        render();
      };
      modes.append(button);
    }
  }

  function tap(what, value) {
    if (what === "arrows") state.arrows = !state.arrows;
    if (what === "sheet") state.sheet = !state.sheet;
    if (what === "drawer") state.drawer = value;
    if (what === "card") state.card = Math.max(0, value);
    render();
  }

  document.addEventListener("keydown", (event) => {
    const keys = { 1: "A", 2: "B", 3: "C", 4: "D" };
    if (keys[event.key]) {
      state.variant = keys[event.key];
      state.arrows = false;
      state.sheet = false;
      state.card = 0;
      render();
    }
    if (event.key === "ArrowRight") tap("card", state.card + 1);
    if (event.key === "ArrowLeft") tap("card", state.card - 1);
  });

  render();
</script>
