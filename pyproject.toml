[project]
name = "chessfen"
version = "0.1.0"
description = "Recognise a chess position from a board image and generate its FEN (and back)"
requires-python = ">=3.13"
dependencies = [
    "cairosvg>=2.9.0",
    "chess>=1.11",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
]

[project.urls]
Repository = "https://github.com/sunfmin/chessfen"

[project.scripts]
chessfen = "chessfen.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.63",
]

[tool.uv]
required-version = ">=0.11"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ANN", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
